# 6S Success website, for the Hostinger Docker Manager.
#
# Paste the contents of this file into the compose editor at
# hpanel.hostinger.com/vps/1369835/docker-manager/compose/6s-success/edit
#
# This pulls a finished image from the GitHub Container Registry rather than
# building from source, so the VPS needs no access to the repository: no deploy
# key, no token in this file, nothing to leak or rotate. The image contains only
# the public website.
#
# To deploy a change: push to main, wait for the Publish site image action, then
# press Redeploy here (or run `docker compose pull && docker compose up -d`).

services:
  web:
    image: ghcr.io/klingdom/6s-success:latest
    container_name: 6s-success
    restart: unless-stopped
    ports:
      # Host port 80 so the domain reaches it directly once DNS points here.
      # If something already holds 80 on this VPS, change to "8973:80" and put a
      # reverse proxy in front instead.
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      # Without this, a busy container's logs grow until the disk fills. That is
      # the most common way a small VPS falls over.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
