# 6S Success website, for the Hostinger Docker Manager.
#
# Paste into the compose editor at
# hpanel.hostinger.com/vps/1369835/docker-manager/compose/6s-success/edit
#
# This pulls a finished image from the GitHub Container Registry rather than
# building from source, so the VPS needs no access to the repository: no deploy
# key, no token in this file, nothing to leak or rotate.
#
# IMPORTANT: this VPS already runs Ledgerium AI, and something is already
# serving port 80 (openresty, answering "Default Site"). This compose therefore
# does NOT bind port 80. Taking it would fight the existing reverse proxy and
# could take a live product offline.
#
# Instead the site listens on 8973 and the existing proxy forwards to it. See
# "Wiring the proxy" in DEPLOY-VPS.md.

services:
  web:
    image: ghcr.io/klingdom/6s-success:latest
    container_name: 6s-success
    restart: unless-stopped
    ports:
      # Deliberately NOT "80:80". See the note above. The reverse proxy that
      # already owns 80 forwards 6s-success.com to this port.
      - "8973:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      # Without this a container's logs grow until the disk fills, which is the
      # most common way a small VPS carrying several projects falls over.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
