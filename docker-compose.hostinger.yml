# 6S Success website, for the Hostinger Docker Manager.
#
# Paste into the .yaml editor at
# hpanel.hostinger.com/vps/1369835/docker-manager/compose/6s-success/edit
#
# THIS VPS IS SHARED. It also runs Ledgerium AI and Compassion Benchmark. Two
# rules follow from that and neither is optional:
#
#   1. Do not bind port 80 or 8080. Nginx Proxy Manager owns 80 and Compassion
#      Benchmark owns 8080. This listens on 8973 and NPM forwards to it.
#   2. There is no auto updater. A Watchtower container was added and removed
#      the same day: it crash looped on this host, and a container restarting
#      forever on a box that also runs two live products is not worth an
#      automatic pull. Deploys are a Redeploy click until that is understood.

services:
  web:
    # The registry path is required. Written as plain "6s-success:latest" Docker
    # finds a stale local image of that name and never contacts the registry,
    # which silently served an old build of this site for a day.
    image: ghcr.io/klingdom/6s-success:latest
    container_name: 6s-success
    restart: unless-stopped
    ports:
      - "8973:80"
    networks:
      proxy:
        aliases:
          - 6s-success
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
    name: 6s-proxy
