server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # compress text assets (nginx already knows woff2/pdf MIME types)
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # long cache for fingerprint-stable static assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    location /downloads/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # multi-page static site: serve the file, the directory index, else 404
    location / {
        try_files $uri $uri/ =404;
    }

    # tidy: send bare /page to /page.html if it exists
    location = / { try_files /index.html =404; }
}
