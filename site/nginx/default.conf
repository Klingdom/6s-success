    # puts a content hash on every stylesheet and script reference, and CI fails
    # if any page ships without one, so the long cache is finally earned.
    #
    # immutable tells the browser not to revalidate at all: the URL changes when
    # the bytes change, so a request for this exact URL can never be stale.
