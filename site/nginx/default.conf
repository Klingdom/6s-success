    # the browser check with the server on every load; nginx still answers a
    # 304 when the file is unchanged, on the file's own mtime, so this costs
    # a round trip rather than a re-download and a real edit is live on the
    # visitor's very next page load instead of up to 30 days later.
    location ~* ^/assets/(css|js)/ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
