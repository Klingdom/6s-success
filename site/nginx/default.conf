server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # compress text assets (nginx already knows woff2/pdf MIME types)
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # long cache for fingerprint-stable static assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }
    location /downloads/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ---- analytics ----------------------------------------------------
    # Umami runs on this host but outside this compose project, published on
    # port 32769. Every page carries a tag pointing at /stats, and until now
    # /stats returned 404, so the site has recorded zero visits since launch.
    #
    # This proxies the two paths the tracker actually uses and nothing else.
    # Umami's admin interface and login page are deliberately NOT exposed
    # under our domain: the tracker only ever fetches script.js and POSTs to
    # api/send, so anything more would be surface with no purpose.
    #
    # The upstream is the host's own public address rather than a container
    # name. Umami is not part of this project and does not share its compose
    # network, so there is no name to resolve, and an IP literal also avoids
    # nginx resolving an upstream name once at startup and caching a stale
    # answer. Traffic to it stays on this machine.
    #
    # X-Forwarded-For is appended rather than set, so the visitor's address
    # survives the hop from Nginx Proxy Manager. Without it Umami would record
    # every visit in the world as coming from this container.
    location = /stats/script.js {
        proxy_pass http://187.77.25.50:32769/script.js;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /stats/api/send {
        proxy_pass http://187.77.25.50:32769/api/send;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A beacon must never be cached or it stops being a beacon.
        add_header Cache-Control "no-store";
    }

    # multi-page static site: serve the file, the directory index, else 404
    location / {
        # $uri.html lets the book print short URLs like 6s-success.com/resources
        # rather than /resources.html. Without it every link printed in the book
        # would 404.
        try_files $uri $uri.html $uri/ =404;
    }

    # tidy: send bare /page to /page.html if it exists
    location = / { try_files /index.html =404; }
}
