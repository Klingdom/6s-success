# ---- a crawl record that survives the container ----------------------
# Every access log this site has ever written went to stdout, so it lived in
# `docker logs` and nothing else. `docker logs` is emptied by every deploy:
# checked on 2026-09-20, the container had restarted an hour earlier and the
# entire crawl history was one hour long. That is not a small inconvenience.
# Google Search Console is verified to nothing (OWNER-ACTIONS item 1a needs a
# paste from Phil), so the server's own log is the ONLY evidence available
# about whether search engines are fetching these pages, and the work aimed at
# being found cannot be evaluated without it.
#
# So: a second log, to a bind-mounted file. The stdout log below is kept as
# well, because `docker logs` is still how a live problem gets looked at.
#
# ONE file, not one per day, and that was measured rather than chosen. A
# date-named path (access-$log_day.log) was built first and tested in a
# container on the VPS: it is the WORKER, running as the unprivileged nginx
# user, that opens a log path containing a variable, and the bind mount is
# owned by root, so every request logged "(13: Permission denied)" while
# serving 200s perfectly happily. It would have shipped as a log directory
# that stayed empty for ever. A static path is opened once by the root master
# process instead, so it needs no ownership arrangement on the host and cannot
# fail this way. Every line carries its own ISO timestamp, so splitting by day
# is the reader's job; ops/crawl_report.py does it.
#
# NO IP ADDRESS IS RECORDED. The question this log answers is "which pages did
# which crawler fetch, and what did it get" and that needs the user agent, not
# the visitor. Human analytics is Umami's job and it already has consent-free
# aggregate measurement. It also means there is no personal data here to
# retain, protect or expire, which is the cheapest privacy decision available
# (CLAUDE.md section 47).
#
# The honest limitation, recorded before anyone reads a number off it: a user
# agent is a claim, not an identity. Verifying Googlebot means reverse-DNS on
# the address, which this log deliberately does not keep. Counts from it are
# "fetches by something calling itself Googlebot" and must be written that way.
log_format crawl '$time_iso8601 $status $request_method $request_uri '
                 '"$http_user_agent" "$http_referer" '
                 '$body_bytes_sent $request_time';

server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # ---- one hostname ----------------------------------------------------
    # www is a CNAME onto this same container, so until 2026-09-17 every page
    # answered 200 at two hostnames. Canonical tags already name the apex, but
    # a canonical is a hint and a 301 is an instruction: Google spent 29 of
    # its 143 fetches here between 10 and 17 September on www URLs, on a site
    # whose whole problem is that Google reads almost none of its pages.
    # Parked in OWNER-ACTIONS item 9 since 2026-09-03 as a proxy change; it
    # never needed the proxy, only this file.
    #
    # Hardcoded https and apex, not $scheme/$host: TLS terminates at Nginx
    # Proxy Manager, so $scheme here is always http, and redirecting to it
    # would add a second hop through the proxy's own http->https 301.
    if ($host ~* ^www\.) {
        return 301 https://6s-success.com$request_uri;
    }

    # Both logs, deliberately. An access_log here would otherwise REPLACE the
    # inherited one from nginx.conf and silently end stdout logging, taking
    # `docker logs` with it.
    #
    # /var/log/nginx/persist is created by the Dockerfile, so if the bind mount
    # is ever missing the site still starts and simply loses history again,
    # rather than failing to boot. A logging change must not be able to take
    # the website down.
    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/persist/access.log crawl;

    # compress text assets (nginx already knows woff2/pdf MIME types)
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    # Level 1 (nginx's default) sent quest-data.js as 167 KB; level 6 packs the
    # same file to about 135 KB (site.css 19.7 -> 16.6 KB, shop.html 35 -> 30 KB).
    # Measured with gzip -1 and -6 on 2026-09-15. CPU cost is negligible here.
    gzip_comp_level   6;
    # text/xml added because sitemap.xml is 33 KB and was being
    # served uncompressed to every crawler that asked for it.
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml
                      text/xml application/xml application/manifest+json;

    # HTML carries no-cache, which does NOT mean do not store. It means store it
    # but revalidate before reuse, which with nginx's ETag costs a 304 and no
    # body. Without it a browser guesses a lifetime from Last-Modified and may
    # hold a page for hours, and a held page holds its asset fingerprints too,
    # which would undo the hashing below.
    #
    # This lives at server level, not in `location / {`, because `/` itself is
    # served by the exact-match `location = /` further down, which never
    # inherited it. The live site answered with no Cache-Control at all until
    # that was checked against the running server rather than the config.
    #
    # The location blocks below set their own and so override this. nginx
    # add_header replaces the inherited set rather than adding to it.
    add_header Cache-Control "no-cache";

    # Images and fonts change rarely and are NOT fingerprinted: they are
    # replaced by adding a file, not by editing one. Long cache, but no
    # immutable, because the URL does not change when the bytes do and a browser
    # told immutable would never come back to check.
    location ~* ^/assets/(img|fonts)/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # CSS and JS are fingerprinted: every reference carries a content hash, so
    # the URL changes whenever the bytes do and this exact URL can never be
    # stale. That is what immutable asserts, and it means zero revalidation
    # round trips rather than one per asset per page load.
    #
    # This is the second fix for the same bug and it supersedes the first. Both
    # were written the same night: must-revalidate, which made every page load
    # pay a conditional request for each asset, and this, which pays nothing
    # after the first load. The header is only honest because
    # ops/fingerprint_assets.py maintains the hashes and CI refuses to publish
    # if any page carries a stale one. Without that gate, immutable here would
    # be the original bug made permanent.
    location ~* ^/assets/(css|js)/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    # Catch-all for anything added under /assets/ that is neither of the above.
    # Deliberately NOT immutable: an unrecognised asset is by definition one
    # nothing fingerprints, and immutable on an unversioned URL is the exact bug
    # the two blocks above exist to fix.
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000";
    }
    location /downloads/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # ---- analytics ----------------------------------------------------
    # Umami runs on this host but outside this compose project, published on
    # port 32769. Every page carries a tag pointing at /stats, and until now
    # /stats returned 404, so the site has recorded zero visits since launch.
    #
    # This proxies the two paths the tracker actually uses and nothing else.
    # Umami's admin interface and login page are deliberately NOT exposed
    # under our domain: the tracker only ever fetches script.js and POSTs to
    # api/send, so anything more would be surface with no purpose.
    #
    # The upstream is the host's own public address rather than a container
    # name. Umami is not part of this project and does not share its compose
    # network, so there is no name to resolve, and an IP literal also avoids
    # nginx resolving an upstream name once at startup and caching a stale
    # answer. Traffic to it stays on this machine.
    #
    # X-Forwarded-For is appended rather than set, so the visitor's address
    # survives the hop from Nginx Proxy Manager. Without it Umami would record
    # every visit in the world as coming from this container.
    location = /stats/script.js {
    # Upstreams go to the Docker bridge gateway (172.17.0.1), not to this
    # host's PUBLIC address, which is what they used until 2026-09-17.
    #
    # Measured that day: Umami on 32769 and Listmonk on 8081 are published on
    # 0.0.0.0 and answer the open internet (Umami's login page included), the
    # host runs no firewall at all (ufw inactive), and OWNER-ACTIONS item 8
    # has asked for them to be closed since August. They could not be closed
    # while this file reached them through the public address: binding them to
    # the bridge would have taken the site's analytics and signup form down
    # with them.
    #
    # Proved from inside this very container before changing anything:
    # 172.17.0.1:32769/api/heartbeat returns {"ok":true} and 172.17.0.1:8081
    # serves Listmonk. So the site no longer depends on those services being
    # publicly addressable, and closing them is now a one-line change to their
    # own compose files that cannot break this one.
        proxy_pass http://172.17.0.1:32769/script.js;
        # Analytics must never be able to take the website down. With no
        # timeouts these inherit nginx's 60 second defaults, so a wedged
        # Umami holds a worker connection per beacon for a minute at a
        # time, out of the same 1024 per worker that serve the HTML. The
        # failure mode is not "analytics degrade", it is "pages stop
        # loading" while every file on disk is perfectly fine. A dropped
        # beacon costs one row in a chart.
        proxy_connect_timeout 2s;
        proxy_send_timeout    3s;
        proxy_read_timeout    3s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        # Umami sends its own Cache-Control (max-age 86400, must-revalidate).
        # add_header does not replace an upstream header, it adds a second one,
        # and two Cache-Control headers is unspecified behaviour. Hide theirs,
        # then set ours. Same defect as the expires duplication above, but this
        # one comes from the proxied service rather than from nginx.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /stats/api/send {
        proxy_pass http://172.17.0.1:32769/api/send;
        # Analytics must never be able to take the website down. With no
        # timeouts these inherit nginx's 60 second defaults, so a wedged
        # Umami holds a worker connection per beacon for a minute at a
        # time, out of the same 1024 per worker that serve the HTML. The
        # failure mode is not "analytics degrade", it is "pages stop
        # loading" while every file on disk is perfectly fine. A dropped
        # beacon costs one row in a chart.
        proxy_connect_timeout 2s;
        proxy_send_timeout    3s;
        proxy_read_timeout    3s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A beacon must never be cached or it stops being a beacon.
        add_header Cache-Control "no-store";
    }

    # nginx's mime.types has no entry for .webmanifest, so it fell through to
    # application/octet-stream. Chrome warns on that and some install paths
    # refuse it outright, which would make the app quietly not installable while
    # every file returned 200. The one thing this whole layer exists for.
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # ---- mailing list ------------------------------------------------
    # Listmonk runs on this host outside this compose project, on port 8081,
    # over plain HTTP. A form on an HTTPS page cannot post to it directly:
    # browsers block that as mixed content, silently, with the visitor seeing
    # nothing happen at all. So it is proxied, which also keeps the visitor on
    # our own domain rather than bouncing them to a bare IP.
    #
    # Only the public subscription form is exposed. Listmonk's admin interface
    # and its API are deliberately NOT reachable under this domain.
    location = /subscribe {
        proxy_pass http://172.17.0.1:8081/subscription/form;
        # The mailing list form must never be able to take the website down. With no
        # timeouts these inherit nginx's 60 second defaults, so a wedged
        # Listmonk holds a worker connection per beacon for a minute at a
        # time, out of the same 1024 per worker that serve the HTML. The
        # failure mode is not "analytics degrade", it is "pages stop
        # loading" while every file on disk is perfectly fine. A dropped
        # failed form submission is recoverable.
        proxy_connect_timeout 2s;
        proxy_send_timeout    3s;
        proxy_read_timeout    3s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store";
    }

    # A real 404 rather than nginx's stock 153 byte page, which carries no
    # navigation, no way back, and the server version in its footer. A crawler
    # or a mistyped link is somebody's first impression of this site, and the
    # page they land on now offers the zones, the method and the free reset.
    # It stays a genuine 404 status: the page is friendly, the code is honest.
    error_page 404 /404.html;
    location = /404.html { internal; }

    # A directory with no index.html makes nginx answer 403 Forbidden. That is
    # both wrong and alarming: nothing is being withheld, there is simply no
    # page at that address. Measured on the live site, /rooms/, /deck/ and
    # /downloads/ all answered 403 while /zones/ and /articles/ answered 200,
    # the only difference being whether the directory happened to have an
    # index. A visitor who guesses a directory URL, and a crawler that finds
    # one, both deserve better than "Forbidden".
    #
    # The two with a real destination go there. /rooms/ is not given its own
    # index because resources.html is already the rooms hub, and a second one
    # would be a duplicate page competing with it.
    # ---- one URL per content page ----------------------------------------
    # Every zone, room and article declares an extensionless canonical and every
    # internal link and sitemap entry uses it, but try_files below also serves
    # the same file at <path>.html with a 200. Googlebot found both: on 23 to 27
    # August it fetched all 115 zone URLs twice, once in each form (proxy log,
    # 373 fetches from 66.249.x), then fell to a handful a week. A crawler with
    # this little appetite for the site should not read every page twice.
    # Scoped to the three directories whose canonicals are extensionless; the
    # top-level pages (quest.html, shop.html ...) canonicalize WITH .html and
    # must not be touched.
    #
    # Section indexes are deliberately NOT redirected here. /zones/ resolves
    # internally to /zones/index.html through try_files, and an internal
    # redirect is matched against these locations again, so a rule for
    # index.html turned /zones/ into a 301 to itself. Measured in a test
    # container before shipping, not after. index.html keeps its 200 and its
    # canonical to the trailing-slash URL.
    location ~ ^/(zones|rooms|articles)/(?!index\.html$)([^/]+)\.html$ {
        return 301 https://6s-success.com/$1/$2$is_args$args;
    }

    location = /rooms/ { return 301 https://6s-success.com/resources.html; }
    location = /deck/  { return 301 https://6s-success.com/deck.html; }

    # Everything else that would have been a 403 becomes an honest 404 on our
    # own page. This site has no authentication and serves no protected paths,
    # so a 403 here can only mean a directory without an index. If that ever
    # stops being true, this line has to be revisited.
    error_page 403 =404 /404.html;

    # multi-page static site: serve the file, the directory index, else 404
    #
    # HTML carries no-cache, which does NOT mean do not store. It means store it
    # but revalidate before reuse, which with the ETag above costs a 304 and no
    # body. Without this header a browser is free to guess a lifetime from
    # Last-Modified and hold a page for hours, and a page held is a page whose
    # asset fingerprints are also held, which would undo the whole point of the
    # hashing above.
    location / {
        # $uri.html lets the book print short URLs like 6s-success.com/resources
        # rather than /resources.html. Without it every link printed in the book
        # would 404.
        try_files $uri $uri.html $uri/ =404;
    }

    # tidy: send bare /page to /page.html if it exists
    location = / { try_files /index.html =404; }
}
