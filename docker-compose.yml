# 6S Success website. Builds the nginx image and serves the static site.
#
# Plain VPS (map a host port, reach it at http://SERVER_IP:8973):
#   docker compose up -d --build
#
# Behind a reverse proxy (Traefik / Nginx Proxy Manager / Caddy), REMOVE the
# "ports:" block and let the proxy route to this container on port 80.
# Traefik example labels are included below, commented out.

services:
  web:
    build: .
    image: 6s-success:latest
    container_name: 6s-success
    restart: unless-stopped
    ports:
      - "8973:80"        # host:container  -> delete this when using a reverse proxy
