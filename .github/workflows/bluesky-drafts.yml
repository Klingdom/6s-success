name: Bluesky drafts

# One more morning email, for the one channel that already works and had no
# pipeline at all: Bluesky already has a real account and has already sent
# this site 5 real visitors, all time, at zero authored cost, while
# social-drafts.yml drafts for Facebook and X before either even has an
# account (OWNER-ACTIONS.md item 18). ops/bluesky_drafts.py serves the same
# already-280-character-filtered "x-post" pool social-drafts.yml's X draft
# reads (Bluesky's own 300-character cap is a strict superset of X's), under
# its own rotation key so the two never silently exhaust each other's supply.
#
# It drafts, he posts. There is no automation against Bluesky's API here and
# there should not be: an unreviewed script posting under a real account
# credential this repository does not hold is exactly the shape
# linkedin-drafts.yml and social-drafts.yml both already avoid on purpose.
#
# Same lateness pattern documented on every other scheduled workflow here
# (see linkedin-drafts.yml's own comment and gate_scheduled_workflow_cadence
# in ops/preflight.py). Offset from social-drafts.yml's own 13:30 UTC cron so
# both morning drafts do not compete for the same GitHub Actions scheduling
# slot; not the one email that has to land before coffee, so no early
# compensation is applied.
#
# A SECOND WAY IN, the same shape fulfil-orders.yml, linkedin-drafts.yml and
# social-drafts.yml already use: a push trigger is only safe when something
# ELSE holds the state, so two runs cannot both act. Here, as in those files,
# there is no natural ledger, so the gate step below checks for the one thing
# a REAL send actually produces (today's own rotation-advance commit): a push
# sends only if no real send has happened today AND the clock is past this
# cron's own time, which leaves the schedule its chance first.
#
# NOT simply "no run has succeeded today", found and fixed 2026-09-30, this
# operator, the day this workflow first ran: a stood-down push (before cron
# time, or once already sent) exits 0 and is itself a "successful" run, so a
# workflow-run-status count sees every ordinary push of the day as a false
# "already sent" and can never fire for real. linkedin-drafts.yml and
# social-drafts.yml carry the identical shape and have simply never needed
# the fallback to actually fire, because their own schedules have always
# eventually run the same day; that is luck, not proof the mechanism works,
# and is worth the same fix there when one of their schedules genuinely
# misses a whole day.

on:
  schedule:
    - cron: '5 14 * * *'      # fires ~14:05 UTC, after social-drafts' 13:30
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: bluesky-drafts
  cancel-in-progress: false

jobs:
  drafts:
    runs-on: ubuntu-latest
    # A short job with no timeout can sit for hours holding its concurrency
    # group. Nothing has hung yet; this is so a hang cannot become a silent
    # outage of the report.
    timeout-minutes: 20
    permissions:
      contents: write         # the last step commits ops/corpus-rotation.json
      actions: read           # the gate step reads this workflow's own runs
    steps:
      - name: Decide whether this run should send
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT_NAME" != 'push' ]; then
            echo 'send=yes' >> "$GITHUB_OUTPUT"
            echo 'schedule or manual run: sending.'
            exit 0
          fi
          # Push is the FALLBACK. Give the schedule until its own cron time
          # before standing in for it.
          now=$(date -u +%s)
          target=$(date -u -d 'today 14:05' +%s)
          if [ "$now" -lt "$target" ]; then
            echo 'send=no' >> "$GITHUB_OUTPUT"
            echo 'before 14:05 UTC: leaving it to the schedule.'
            exit 0
          fi
          # Found 2026-09-30, this operator, the day this workflow first
          # ran: a `?status=success` count of this workflow's OWN runs is
          # not a ledger of sends, it is a ledger of runs that did not
          # crash, and nearly every run today (44 by the time this was
          # found) is a push from some other file changing, standing down
          # here with `exit 0` before 14:05 -- which is itself a SUCCESSFUL
          # run. So the very first push checked after 14:05 already counts
          # dozens of stood-down "successes" from earlier the same day and
          # reports "already sent" without a single real send having
          # happened, on any day with the normal volume of commits this
          # repository makes. Confirmed directly: zero `schedule`-triggered
          # runs exist yet today (the cron had not fired), and zero
          # "Bluesky drafts: advance rotation" commits exist anywhere in
          # this repository's history, so the fallback had never actually
          # been exercised despite reporting a clean gate every time.
          # linkedin-drafts.yml and social-drafts.yml share this exact
          # shape and have simply never needed the fallback to work, because
          # their own schedules have always eventually fired the same day.
          #
          # Fixed by checking for the one thing a REAL send actually
          # produces, the rotation-advance commit the last step below
          # makes, instead of the workflow's own run status.
          today_start=$(date -u +%Y-%m-%dT00:00:00Z)
          n=$(gh api "repos/$GITHUB_REPOSITORY/commits?since=$today_start&path=ops/corpus-rotation.json&per_page=100" \
                --jq '[.[] | select(.commit.message | startswith("Bluesky drafts: advance rotation"))] | length' \
                2>/dev/null || echo unknown)
          if [ "$n" = unknown ]; then
            # Could not read the ledger. Do NOT send: a duplicate on every
            # push is worse than a late email, and both the schedule and the
            # manual dispatch still work.
            echo 'send=no' >> "$GITHUB_OUTPUT"
            echo '::warning::could not read the commit ledger; standing down rather than risking repeats.'
            exit 0
          fi
          if [ "$n" -gt 0 ]; then
            echo 'send=no' >> "$GITHUB_OUTPUT"
            echo "already sent today ($n rotation-advance commit(s))."
            exit 0
          fi
          echo 'send=yes' >> "$GITHUB_OUTPUT"
          echo 'past 14:05 UTC with no real send today: standing in for the schedule.'

      - uses: actions/checkout@v4
        if: steps.gate.outputs.send == 'yes'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.send == 'yes'
        with:
          python-version: '3.12'

      - name: Check it can send before it builds anything
        if: steps.gate.outputs.send == 'yes'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: |
          [ -z "$SMTP_HOST" ] && { echo "::error::No SMTP_HOST, nothing can be sent."; exit 1; }
          [ -z "$OWNER_EMAIL" ] && { echo "::error::No OWNER_EMAIL, there is nobody to send to."; exit 1; }
          echo "credentials present"

      - name: Write and send today's Bluesky drafts
        if: steps.gate.outputs.send == 'yes'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: python ops/bluesky_drafts.py --send "$OWNER_EMAIL"

      # Same gap linkedin-drafts.yml and social-drafts.yml both already
      # closed for themselves: --send's rotation write only ever lives on
      # this runner's disk unless committed back, or every run re-reads the
      # same committed served-set and serves the identical posts forever.
      - name: Persist the rotation so tomorrow does not repeat today
        if: steps.gate.outputs.send == 'yes'
        run: |
          set -eu
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add ops/corpus-rotation.json
          git diff --cached --quiet && exit 0
          git commit -m 'Bluesky drafts: advance rotation'
          # Found 2026-09-30, this operator, the day this fallback first
          # actually fired for real: linkedin-drafts.yml, social-drafts.yml
          # and this file all trigger on the same `push` event, and their
          # crons are staggered specifically so their SCHEDULED runs do not
          # collide, but a single push past multiple cron targets at once
          # fires every fallback in the same instant with no such
          # staggering. social-drafts.yml's own commit lost this exact race
          # the first time it happened: its rebase conflicted against this
          # workflow's own concurrent commit to the same file, the silent
          # `|| true` swallowed the failure, and the real send it had
          # already made was never recorded, so tomorrow's draft could
          # repeat it. A retry with a fresh rebase fixes the common case (a
          # transient lag against an unrelated change); a genuine same-file,
          # same-moment collision may still lose, so this warns loudly
          # rather than pretending success either way.
          pushed=0
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "rebase conflict on attempt $attempt, retrying"
            fi
            sleep "$attempt"
          done
          if [ "$pushed" != 1 ]; then
            echo "::warning::could not persist today's rotation after 5 attempts (last error above). The draft was sent; tomorrow's rotation may repeat it."
          fi
