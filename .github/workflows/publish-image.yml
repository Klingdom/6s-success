name: Publish site image

# Build the website image here and publish it to the GitHub Container Registry,
# so the production host never needs access to this repository at all. It pulls
# a finished image instead of cloning source, which means:
#   no deploy key on the VPS, no repository credential in the Docker Manager UI,
#   and a deploy that is a pull of a known tag rather than a rebuild from a
#   moving branch.
# The image holds only site/, which is the public website, so the package can be
# public and the host needs no registry login either.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'Dockerfile'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    # A 20 second job with no timeout can sit for six hours
    # holding its concurrency group. Nothing has hung yet; this is
    # so that a hang cannot become a silent outage of the report.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # gate_workflows_healthy (preflight.py, run below) reads the Actions
      # API directly to see whether every workflow is still running and
      # still passing; it needs this to query anything at all.
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Install python dependencies
        # ops/requirements.txt: preflight.py's affiliate gate opens PDFs and
        # EPUBs to look for a tracked link, and needs pymupdf to read inside
        # them. Without this, that gate cannot read a delivered PDF, fails
        # closed, and blocks every deploy that touches site/.
        run: pip install --quiet -r ops/requirements.txt

      - name: Refuse to publish a secret
        run: |
          # The image is public. Anything under site/ is served verbatim, so a
          # credential there would be world readable the moment this pushes.
          # Fail the build rather than publish one.
          if grep -rIlE 'sk_live_|sk_test_|SMTP_PASS|BEGIN [A-Z ]*PRIVATE KEY' site/ ; then
            echo "::error::A credential pattern was found under site/. Refusing to publish."
            exit 1
          fi
          echo "no credential patterns under site/"

      - name: Refuse to publish stale asset fingerprints
        # /assets/ is served with a thirty day immutable cache, which is only
        # safe because every reference carries a content hash. About a dozen
        # generators write HTML and none of them knows about the hash, so a page
        # rebuilt without running the fingerprint pass would ship a reference
        # that pins the wrong bytes for a month. Nobody would notice until a fix
        # failed to reach real visitors, which is exactly how this was found.
        #
        # Cheap, no credentials, and it fails before anything is pushed.
        run: |
          python3 ops/fingerprint_assets.py --check

      - name: Build the gitignored catalogue
        # The 155 zone/room/situation/area product pages live under
        # build/products/, which is gitignored, so they do not exist on a
        # fresh checkout. Without this, preflight's sellable gate correctly
        # reports every one of them as "a file that is not built" and fails,
        # which is a build-environment gap, not a real defect.
        run: python3 ops/build_catalog.py --build

      - name: Preflight, including generator ownership
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # gate_generator_ownership reruns eleven generators and fails if any
        # committed file differs from what its generator produces. It is issue
        # #26: nine separate occasions where a generator was one run away from
        # deleting content its own template does not produce, every one caught
        # by luck or by a diff someone happened to read.
        #
        # It sits behind --own because it takes about eighty seconds, and the
        # consequence was that it ran essentially never: not in a normal local
        # preflight and not here. The most expensive gate in the repository was
        # the one nothing was running. Eighty seconds before publishing an
        # image is a trade worth making.
        #
        # It needs a clean tree to mean anything, which a fresh checkout is.
        # --own runs every other gate too, so this replaces the plain
        # preflight step rather than sitting beside it.
        run: python3 ops/preflight.py --own


      - name: Refuse to publish drifted product copy
        # site/assets/js/data.js and ops/retired-skus.json are the source of
        # truth for what is sold and what it costs. Three cycles running, a
        # page's prose drifted out of step with them and was only caught by
        # hand: a retired SKU still sold, a price that did not match the
        # catalogue. See issue #24. Cheap, no credentials, no network, and it
        # fails before anything is pushed rather than after a reader notices.
        run: |
          python3 ops/audit_catalog.py

      - name: Refuse to publish an nginx config that will not start
        # The whole site is served by one nginx config, and a syntax error in
        # it does not degrade the site, it stops the container starting. That
        # would take production down on the very deploy meant to bring it back.
        # Nothing validated this file before: there is no nginx on the author's
        # machine and the local Docker daemon is often down, so the config was
        # being written blind and shipped on trust.
        #
        # The runner has Docker, and the image the site actually runs on can
        # check its own config in about two seconds.
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/site/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t
          echo "nginx config parses and would start"

      - name: Set up buildx
        # Required for the GitHub Actions cache backend below. The default
        # driver is plain docker, which cannot export a cache, and the build
        # fails with "Cache export is not supported for the docker driver".
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build the image so it can be tested before anyone gets it
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: sixs-success:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the image and check what it actually returns
        # `nginx -t` proves the config parses. It does not prove the site
        # answers correctly, and those are very different things. Three
        # directories on the live site, /rooms/, /deck/ and /downloads/, spent
        # months answering 403 Forbidden because they had no index.html, while
        # /zones/ and /articles/ answered 200. Every gate in this repository
        # passed the whole time, because nothing had ever asked the running
        # server a question.
        #
        # This runs the real image and asserts real status codes. It runs
        # before the push, so an image that answers wrongly is never published.
        run: |
          set -uo pipefail
          docker run -d --name sixs -p 8080:80 sixs-success:ci
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8080/ && break
            sleep 1
          done

          fail=0
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$1")
            if [ "$code" != "$2" ]; then
              echo "  FAIL  $1 returned $code, expected $2   ($3)"
              fail=1
            else
              echo "  ok    $1 -> $code   ($3)"
            fi
          }

          check /                        200 "home page"
          check /index.html              200 "home page by name"
          check /resources.html          200 "the rooms and micro zones hub"
          check /zones/                  200 "zone index"
          check /articles/               200 "article index"
          check /404.html                404 "the 404 page is a real 404"
          check /no-such-page-here       404 "a missing page"
          check /resources               200 "extensionless URL printed in the book"
          check /rooms/                  301 "directory with no index, sent to the hub"
          check /deck/                   301 "directory with no index, sent to the deck"
          check /downloads/              404 "directory with no index and nowhere to send it"
          # The directory must 404 while the files inside it must not:
          # these are what a paying customer is sent after buying.
          check /downloads/6S-Standards-Pack.html   200 "a delivered file still serves"
          check /downloads/6S-Entryway-Deck-PrintAndPlay.pdf 200 "a delivered PDF still serves"

          # The thirteen checks above are the ones I thought to write down.
          # The sitemap is the list we actually promise search engines is
          # real, all 184 of them, and until now nothing had ever asked the
          # server about any of it.
          echo "--- every URL in the sitemap ---"
          python3 ops/check_urls.py --live http://localhost:8080 || fail=1

          echo "--- container log ---"
          docker logs sixs 2>&1 | tail -15
          docker rm -f sixs >/dev/null 2>&1 || true
          if [ "$fail" != "0" ]; then
            echo "The image does not serve what it should. Not publishing it."
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report what was published
        run: |
          echo "Published:"
          echo "${{ steps.meta.outputs.tags }}" | sed 's/^/  /'
          echo ""
          echo "The host pulls this. It needs no access to this repository."
