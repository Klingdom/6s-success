name: Render stale narrated videos

# ops/render_stale_narrated.py re-renders narrated zone videos whose captions
# no longer match content.json's own standard (BACKLOG-2026-09-07.md's C7
# "second wave": the 2026-10-02 British-to-American dialect fix landed after
# the last full re-render, leaving 15 of 114 zones' captions reading
# labelled/tyre against the page's own labeled/tire). Not customer-facing:
# ops/youtube_upload.py already withholds anything check_video_standard.py
# calls stale, so a late or skipped run here costs nothing a viewer can see.
#
# Needs real audio (edge-tts, reaching speech.platform.bing.com) and ffmpeg.
# The cloud sandbox this repository is usually operated from refuses that
# destination at its own egress proxy (confirmed directly: a DNS-level
# connection failure to that host specifically), which is why this runs on a
# GitHub-hosted runner instead, the same pattern publish-mcp.yml uses
# (push scoped to content/manual/source/content.json) rather than
# keyword-demand.yml/indexation-check.yml, which are schedule-only and
# trigger on no file path at all.
#
# Corrected 2026-10-14, this operator: the three prior failures here
# (WSServerHandshakeError: 403 from speech.platform.bing.com, across three
# different runner IPs) were wrongly diagnosed as an application-layer block
# on datacenter IPs with no workflow-side fix. That was never the cause.
# edge-tts/edge-tts#490 (closed 2026-10-13, the same day the second failing
# attempt here ran) root-caused it: Microsoft Edge 155 moved to a v2
# `Sec-MS-GEC` token format, and edge-tts 7.2.8, the version pinned below at
# the time, still sent the old v1 token, which the server now rejects with
# exactly this 403. The maintainer confirmed "resolved as of edge-tts 7.3.0".
# Pinned to 7.3.1 (latest at the time of this fix) below. If this fails again
# with the same 403 on a current edge-tts version, the IP-block theory would
# then be worth re-examining; it was never confirmed, only assumed, the first
# three times.
#
# C7 fourth-wave prevention (BACKLOG-2026-09-07.md): three straight waves
# of this exact drift (2026-10-09, 2026-10-13, 2026-10-27) were each only
# caught because some later cycle happened to notice gate_tests's
# gate_zone_videos_match_standard WARN and hand-dispatch this workflow.
# check_video_standard.py's own gate still warns preflight.py every time a
# video goes stale, but nothing used to act on that warning by itself.
# Added 2026-10-27: a push trigger scoped to content.json's own path, the
# same pattern publish-mcp.yml already uses, so an edit to that file
# re-renders any now-stale captions on its own instead of waiting for the
# next cycle's cold read. Still no schedule: rendering is slow (narration, a
# screenshot per beat, and an ffmpeg encode for each of two orientations per
# zone), and a schedule would re-render nothing most weeks while silently
# burning minutes checking. Safe as a push trigger for the same reason
# fulfil-orders.yml's push trigger is safe: ops/render_stale_narrated.py's
# own stale_pairs() re-derives which zones are stale fresh each run, straight
# from check_video_standard.py's compare(), rather than trusting what an
# earlier run thought was stale, so two overlapping runs (a push run racing
# a manual workflow_dispatch) converge on the same result instead of
# double-rendering, and cancel-in-progress: false below queues rather than
# kills either one.

on:
  push:
    branches: [main]
    paths:
      - 'content/manual/source/content.json'
  workflow_dispatch:

concurrency:
  group: render-narrated-videos
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write        # commits the regenerated .srt sidecars
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install edge-tts and a headless Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install edge-tts==7.3.1 playwright==1.48.0
          python -m playwright install --with-deps chromium
          # ops/browser.py's find_browser() only looks at the fixed paths it
          # knows (the cloud sandbox's own /opt/pw-browsers/chromium, plus two
          # Windows Edge paths). A plain `playwright install` puts the binary
          # in a versioned cache directory it never checks, so link the one
          # it does into existence rather than teach it a third, runner-only
          # path for a file that is not source.
          CHROME_PATH=$(python -c "from playwright.sync_api import sync_playwright as s; p = s().start(); print(p.chromium.executable_path); p.stop()")
          sudo mkdir -p /opt/pw-browsers
          sudo ln -sf "$CHROME_PATH" /opt/pw-browsers/chromium

      - name: Report what is stale before rendering
        run: python ops/render_stale_narrated.py --check || true

      - name: Re-render every stale zone, both orientations
        run: python ops/render_stale_narrated.py

      - name: Commit the regenerated captions
        if: always()
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add build/video/zones-narrated/*.srt
          git diff --cached --quiet || git commit -m 'Re-render narrated captions that had gone stale against content.json'
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main
