# NOT YET IN site/nginx/default.conf. Paste inside the server block when the
# photos container is running, or /api/photos/ will answer 502.
location /api/photos/ {
    client_max_body_size 12m;
    proxy_pass http://172.17.0.1:8975/;
    proxy_connect_timeout 2s;
    proxy_send_timeout    30s;
    proxy_read_timeout    120s;           # an analysis call can take a while
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;                       # paths carry session ids; keep them out of logs
}
